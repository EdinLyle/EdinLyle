name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create dist directory
        run: mkdir -p dist

      - name: Download Top Languages Stats
        id: download-langs
        run: |
          # 使用 Rick Staa 镜像（移除 URL 中的空格！）
          URL="https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=EdinLyle&langs_count=10&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=00d9ff&text_color=c9d1d9"
          
          HTTP_CODE=$(curl -sSL -o dist/top-langs.svg -w "%{http_code}" \
            --retry 3 --retry-delay 2 --max-time 15 \
            "$URL")
          
          if [ "$HTTP_CODE" -eq 200 ] && grep -q "<svg" dist/top-langs.svg; then
            echo "✅ Top Langs 下载成功"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ 失败，HTTP $HTTP_CODE"
            rm -f dist/top-langs.svg
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Download GitHub Stats Card
        if: steps.download-langs.outputs.success == 'true'
        run: |
          # Rick Staa 镜像的 stats 接口
          URL="https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api?username=EdinLyle&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117"
          
          HTTP_CODE=$(curl -sSL -o dist/github-stats.svg -w "%{http_code}" \
            --retry 3 --retry-delay 2 --max-time 15 \
            "$URL")
          
          if [ "$HTTP_CODE" -eq 200 ] && grep -q "<svg" dist/github-stats.svg; then
            echo "✅ Stats Card 下载成功"
          else
            echo "❌ Stats Card 失败，HTTP $HTTP_CODE"
            rm -f dist/github-stats.svg
          fi

      - name: Deploy to output branch
        if: steps.download-langs.outputs.success == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          clean: true
